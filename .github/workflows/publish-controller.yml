name: Publish controller

# The controller image changes far more often than the runner image and builds in
# seconds, so it gets its own workflow instead of waiting on a multi-arch runner
# build. Tagged releases publish it too.

on:
  push:
    branches: [main]
    paths:
      - "controller/**"
      - ".github/workflows/publish-controller.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/runlet-controller:latest
            ghcr.io/${{ github.repository_owner }}/runlet-controller:0.1.0
            ghcr.io/${{ github.repository_owner }}/runlet-controller:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=runlet-controller
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
